<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tri-Puntos</title>
<style>
body { text-align: center; font-family: sans-serif; }
canvas { border: 2px solid #333; background: #f9f9f9; cursor: crosshair; }
.controls { margin-top: 10px; }
button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<h1>Juego de Tri-Puntos</h1>
<div class="controls">
<p>Jugador actual: <span id="player-name">Rojo</span> | Turnos restantes: <span id="moves">0</span></p>
<p>Puntos - Rojo: <span id="score-0">0</span> | Azul: <span id="score-1">0</span></p>
<button id="dice-btn" onclick="rollDice()">Lanzar Dado</button>
</div>
<br>
<canvas id="canvas" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const points = [];
const edges = [];
const triangles = [];
const players = [
{ id: 0, name: "Rojo", color: "#FF4136", score: 0 },
{ id: 1, name: "Azul", color: "#0074D9", score: 0 }
];
let currentPlayerIdx = 0;
let movesRemaining = 0;
let selectedPoint = null;

function initGame() {
for (let i = 0; i < 15; i++) {
points.push({
x: 50 + Math.random() * 500,
y: 50 + Math.random() * 300
});
}
draw();
}

function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);

// Dibujar triángulos
triangles.forEach(t => {
ctx.fillStyle = t.color;
ctx.globalAlpha = 0.2;
ctx.beginPath();
ctx.moveTo(t.p1.x, t.p1.y);
ctx.lineTo(t.p2.x, t.p2.y);
ctx.lineTo(t.p3.x, t.p3.y);
ctx.closePath();
ctx.fill();
ctx.globalAlpha = 1.0;
});

// Dibujar líneas
edges.forEach(e => {
ctx.strokeStyle = '#333';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(e.p1.x, e.p1.y);
ctx.lineTo(e.p2.x, e.p2.y);
ctx.stroke();
});

// Dibujar puntos
points.forEach(p => {
ctx.fillStyle = (p === selectedPoint) ? '#2ECC40' : '#333';
ctx.beginPath();
ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
ctx.fill();
});

document.getElementById('player-name').innerText = players[currentPlayerIdx].name;
document.getElementById('player-name').style.color = players[currentPlayerIdx].color;
document.getElementById('moves').innerText = movesRemaining;
document.getElementById('score-0').innerText = players[0].score;
document.getElementById('score-1').innerText = players[1].score;
}

function rollDice() {
if (movesRemaining > 0) return;
movesRemaining = Math.floor(Math.random() * 6) + 1;
document.getElementById('dice-btn').disabled = true;
draw();
}

canvas.addEventListener('click', (e) => {
if (movesRemaining <= 0) return;

const rect = canvas.getBoundingClientRect();
const clickX = e.clientX - rect.left;
const clickY = e.clientY - rect.top;

const clickedPoint = points.find(p =>
Math.hypot(p.x - clickX, p.y - clickY) < 10
);

if (!clickedPoint) return;

if (!selectedPoint) {
selectedPoint = clickedPoint;
} else {
if (selectedPoint !== clickedPoint) {
addEdge(selectedPoint, clickedPoint);
movesRemaining--;
document.getElementById('moves').innerText = movesRemaining;
if (movesRemaining === 0) {
document.getElementById('dice-btn').disabled = false;
currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
}
}
selectedPoint = null;
}
draw();
});

function addEdge(p1, p2) {
const exists = edges.some(e =>
(e.p1 === p1 && e.p2 === p2) || (e.p1 === p2 && e.p2 === p1)
);
if (exists) return;

const newEdge = { p1, p2 };

// Buscar triángulos formados
const p1Connections = new Set();
const p2Connections = new Set();

edges.forEach(e => {
if (e.p1 === p1) p1Connections.add(e.p2);
if (e.p2 === p1) p1Connections.add(e.p1);
if (e.p1 === p2) p2Connections.add(e.p2);
if (e.p2 === p2) p2Connections.add(e.p1);
});

p1Connections.forEach(commonPoint => {
if (p2Connections.has(commonPoint)) {
triangles.push({
p1: p1, p2: p2, p3: commonPoint,
color: players[currentPlayerIdx].color
});
players[currentPlayerIdx].score++;
}
});

edges.push(newEdge);
}

initGame();
</script>
</body>
</html>
